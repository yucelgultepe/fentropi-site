<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    TASLAK — YAYINLANMAZ (bu dosya _drafts/ içinde).
    Yayına geçerken: muzik/index.html olarak taşı.
    TODO: Müzik listesi eklenecek — her eser için: başlık, kısa açıklama,
    dinleme bağlantısı (YouTube/Spotify vb.) veya dosya.
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fentropi — Müzik</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Fentropi — müzik çalışmaları." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0c0f0e; --ink:#eef3ef; --muted:#8a968e; --line:rgba(255,255,255,.08); --accent:#6fbf9a; --accent-ink:#062117; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; font-family:"DM Sans",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    .bg { position:fixed; inset:0; z-index:-1;
      background: radial-gradient(ellipse 70% 50% at 15% 0%, rgba(111,191,154,.18), transparent 55%),
                  radial-gradient(ellipse 50% 40% at 100% 80%, rgba(40,70,55,.45), transparent 50%), var(--bg); }
    .top { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; max-width:980px; margin:0 auto; }
    .brand { font-family:Syne,sans-serif; font-weight:800; font-size:1.25rem; letter-spacing:-.03em; color:var(--ink); text-decoration:none; }
    nav a { color:var(--muted); text-decoration:none; font-weight:600; font-size:.95rem; }
    nav a:hover { color:var(--accent); }
    .doc { max-width:720px; margin:0 auto; padding:32px 24px 64px; }
    .doc h1 { font-family:Syne,sans-serif; font-size:clamp(1.8rem,4vw,2.4rem); letter-spacing:-.03em; margin:0 0 24px; }
    .tracks { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:14px; }
    .tracks li { border:1px solid var(--line); border-radius:16px; padding:16px 18px; background:rgba(255,255,255,.02); }
    .tracks strong { display:block; margin-bottom:4px; }
    .tracks p { margin:0; color:var(--muted); line-height:1.45; font-size:.95rem; }
    .tracks a { color:var(--accent); text-decoration:none; font-weight:600; }
    footer { max-width:980px; margin:0 auto; padding:24px; color:var(--muted); font-size:.88rem; }
    footer a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="/">Fentropi</a>
    <nav><a href="/">Ana sayfa</a></nav>
  </header>

  <main class="doc">
    <h1>Müzik</h1>
    <ul class="tracks">
      <!-- TODO: Her eser için bir <li> kopyala:
      <li>
        <strong>Eser adı</strong>
        <p>Kısa açıklama · <a href="LINK">Dinle</a></p>
      </li>
      -->
      <li>
        <strong>Örnek eser</strong>
        <p>Bu alan müzik listesiyle doldurulacak.</p>
      </li>
    </ul>
  </main>

  <footer>
    <p><a href="/">← Fentropi</a></p>
  </footer>
</body>
</html>
