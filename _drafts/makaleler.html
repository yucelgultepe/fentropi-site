      { t: "Dürüst bir tamirci veya muhalif bir komedyen devleti yönetebilir mi?", u: "https://medium.com/@fentropi/d%C3%BCr%C3%BCst-bir-tamirci-veya-muhalif-bir-komedyen-devleti-y%C3%B6netebilir-mi-123b65a70c37", c: "Toplum & Medya" },
      { t: "Haber değeri neydi, ne oldu?", u: "https://medium.com/@fentropi/haber-de%C4%9Feri-neydi-ne-oldu-a6f37acd8a7e", c: "Toplum & Medya" }
    ];

    // ————— Listeleyici —————
    const cardsEl = document.getElementById("cards");
    const chipsEl = document.getElementById("chips");
    const qEl = document.getElementById("q");
    const countEl = document.getElementById("count");
    const emptyEl = document.getElementById("empty");
    let activeCat = "Tümü";

    const cats = ["Tümü", ...new Set(ARTICLES.map(a => a.c))];
    const trLower = s => s.toLocaleLowerCase("tr");

    function renderChips() {
      chipsEl.innerHTML = "";
      for (const c of cats) {
        const b = document.createElement("button");
        const n = c === "Tümü" ? ARTICLES.length : ARTICLES.filter(a => a.c === c).length;
        b.className = "chip" + (c === activeCat ? " on" : "");
        b.textContent = c + " (" + n + ")";
        b.onclick = () => { activeCat = c; renderChips(); renderCards(); };
        chipsEl.appendChild(b);
      }
    }

    function renderCards() {
      const q = trLower(qEl.value.trim());
      cardsEl.innerHTML = "";
      let shown = 0;
      for (const a of ARTICLES) {
        if (activeCat !== "Tümü" && a.c !== activeCat) continue;
        const hay = trLower(a.t + " " + (a.x || "") + " " + a.c);
        if (q && !hay.includes(q)) continue;
        shown++;
        const thumb = a.img
          ? '<span class="thumb"><img loading="lazy" src="' + a.img + '" alt="" /></span>'
          : '<span class="thumb" aria-hidden="true">' + a.t.trim().charAt(0).toLocaleUpperCase("tr") + "</span>";
        const li = document.createElement("li");
        li.className = "card";
        li.innerHTML =
          '<a href="' + a.u + '" target="_blank" rel="noopener">' +
          thumb +
          '<span class="body"><span class="cat">' + a.c + "</span>" +
          "<strong>" + a.t + "</strong>" +
          (a.x ? '<span class="x">' + a.x + "</span>" : "") +
          "</span></a>";
        cardsEl.appendChild(li);
      }
      countEl.textContent = shown + " yazı";
      emptyEl.style.display = shown ? "none" : "block";
    }

    qEl.addEventListener("input", renderCards);
    renderChips();
    renderCards();
  </script>
</body>
</html>
